        INFISICAL_ENV: ${INFISICAL_ENV:-dev}
        INFISICAL_PATH: /auth-service
    ports: ["3001:3001"]
    env_file: .env
    environment:
      NODE_ENV: production
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
