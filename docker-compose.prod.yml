version: '3.8'

# ── Red ─────────────────────────────────────────────────────────
networks:
  gymcore-net:
    driver: bridge

# ── Servicios ───────────────────────────────────────────────────
services:
  # 🐇  RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gymcore-rabbitmq
    ports: ["5672:5672", "15672:15672"]
    networks: [gymcore-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 📦  Redis
  redis:
    image: redis:7-alpine
    container_name: gymcore-redis
    ports: ["6379:6379"]
    networks: [gymcore-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Microservicios backend ────────────────────────────────────
  # Para cada servicio definimos: SERVICE_NAME  +  INFISICAL_PATH
  api-gateway:
    container_name: gymcore-api-gateway
    build:
      context: .
      dockerfile: backend/apps/Dockerfile.universal
      args:
        SERVICE_NAME: api-gateway
        INFISICAL_TOKEN: ${INFISICAL_TOKEN}
        INFISICAL_ENV: ${INFISICAL_ENV:-dev}
        INFISICAL_PATH: /api-gateway
    ports: ["3000:3000"]
    env_file: .env
    environment:
      NODE_ENV: production
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      INFISICAL_PATH: /api-gateway
    networks: [gymcore-net]
    depends_on: { rabbitmq: { condition: service_healthy } }

  auth-service:
