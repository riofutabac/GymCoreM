networks:
  gymcore-net:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local
  kibana-data:
    driver: local

services:
  # ─── Infrastructure Services ────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gymcore-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - gymcore-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gymcore-redis
    ports:
      - "6379:6379"
    networks:
      - gymcore-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: gymcore-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - node.name=gymcore-elasticsearch
      - cluster.name=gymcore-logging-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - http.cors.enabled=true
      - http.cors.allow-origin="*"
      - http.cors.allow-headers=X-Requested-With,X-Auth-Token,Content-Type,Content-Length,Authorization
      - http.cors.allow-credentials=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - gymcore-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: gymcore-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=gymcore-kibana
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5601
      - ELASTICSEARCH_USERNAME=
      - ELASTICSEARCH_PASSWORD=
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=a7a6311933d3503b89bc2dbc36572c33a6c10925682e591bffcab6911c06786d
    volumes:
      - kibana-data:/usr/share/kibana/data
    networks:
      - gymcore-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─── Microservices ──────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ./backend/apps/api-gateway/Dockerfile
    container_name: gymcore-api-gateway
    ports:
      - "3000:3000"
    env_file:
      - ./backend/apps/api-gateway/.env
    networks:
      - gymcore-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/apps/api-gateway/src:/app/backend/apps/api-gateway/src
      - ./backend/apps/api-gateway/uploads:/app/backend/apps/api-gateway/uploads

  auth-service:
    build:
      context: .
      dockerfile: ./backend/apps/auth-service/Dockerfile
    container_name: gymcore-auth-service
    env_file:
      - ./backend/apps/auth-service/.env
    networks:
      - gymcore-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/apps/auth-service/src:/app/backend/apps/auth-service/src

  gym-management-service:
    build:
      context: .
      dockerfile: ./backend/apps/gym-management-service/Dockerfile
    container_name: gymcore-gym-management-service
    env_file:
      - ./backend/apps/gym-management-service/.env
    networks:
      - gymcore-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/apps/gym-management-service/src:/app/backend/apps/gym-management-service/src

  payment-service:
    build:
      context: .
      dockerfile: ./backend/apps/payment-service/Dockerfile
    container_name: gymcore-payment-service
    env_file:
      - ./backend/apps/payment-service/.env
    networks:
      - gymcore-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/apps/payment-service/src:/app/backend/apps/payment-service/src

  inventory-service:
    build:
      context: .
      dockerfile: ./backend/apps/inventory-service/Dockerfile
    container_name: gymcore-inventory-service
    env_file:
      - ./backend/apps/inventory-service/.env
    networks:
      - gymcore-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/apps/inventory-service/src:/app/backend/apps/inventory-service/src

  analytics-service:
    build:
      context: .
      dockerfile: ./backend/apps/analytics-service/Dockerfile
    container_name: gymcore-analytics-service
    env_file:
      - ./backend/apps/analytics-service/.env
    networks:
      - gymcore-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/apps/analytics-service/src:/app/backend/apps/analytics-service/src

  biometric-service:
    build:
      context: .
      dockerfile: ./backend/apps/biometric-service/Dockerfile
    container_name: gymcore-biometric-service
    ports:
      - "8443:8443"  # Puerto WebSocket
    env_file:
      - ./backend/apps/biometric-service/.env
    networks:
      - gymcore-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/apps/biometric-service/src:/app/backend/apps/biometric-service/src

  notification-service:
    build:
      context: .
      dockerfile: ./backend/apps/notification-service/Dockerfile
    container_name: gymcore-notification-service
    env_file:
      - ./backend/apps/notification-service/.env
    networks:
      - gymcore-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/apps/notification-service/src:/app/backend/apps/notification-service/src

  logging-service:
    build:
      context: .
      dockerfile: ./backend/apps/logging-service/Dockerfile
    container_name: gymcore-logging-service
    env_file:
      - ./backend/apps/logging-service/.env
    networks:
      - gymcore-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backend/apps/logging-service/src:/app/backend/apps/logging-service/src

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: ./frontend/web-dashboard/Dockerfile
      target: runner
    container_name: gymcore-frontend
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://api-gateway:3000
      - NEXTAUTH_URL=http://127.0.0.1:3030
      - NEXTAUTH_SECRET=production-nextauth-secret-key-change-in-production
    networks:
      - gymcore-net
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:3030 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s