version: "3.9"

networks:
  gymcore-net-dev:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local
  kibana-data:
    driver: local

# ─── Definición base para todos los backends ───────────────────────────────────
x-backend-service: &backend-service
  build:
    context: .
    dockerfile: ./backend/apps/Dockerfile.dev
  working_dir: /app
  env_file:
    - .env
  environment:
    - INFISICAL_TOKEN=${INFISICAL_TOKEN}
    - MESSAGE_BUS_URL=${MESSAGE_BUS_URL}
    - REDIS_URL=${REDIS_URL}
  volumes:
    - .:/app
    - /app/node_modules
  networks:
    - gymcore-net-dev
  depends_on:
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ─── Dependencias con healthchecks ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gymcore-rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - gymcore-net-dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gymcore-redis-dev
    ports:
      - "6379:6379"
    networks:
      - gymcore-net-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

