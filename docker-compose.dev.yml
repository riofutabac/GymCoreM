version: "3.9"

networks:
  gymcore-net-dev:
    driver: bridge

# ─── Definición base para todos los backends ───────────────────────────────────
x-backend-service: &backend-service
  build:
    context: .
    dockerfile: ./backend/apps/Dockerfile.dev
  working_dir: /app
  env_file:
    - .env
  environment:
    - INFISICAL_TOKEN=${INFISICAL_TOKEN}
    - MESSAGE_BUS_URL=${MESSAGE_BUS_URL}
    - REDIS_URL=${REDIS_URL}
  volumes:
    - .:/app
    - /app/node_modules
  networks:
    - gymcore-net-dev
  depends_on:
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ─── Dependencias con healthchecks ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gymcore-rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - gymcore-net-dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gymcore-redis-dev
    ports:
      - "6379:6379"
    networks:
      - gymcore-net-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Microservicios ────────────────────────────────────────────────────────

  api-gateway:
    <<: *backend-service
    container_name: gymcore-api-gateway-dev
    ports:
      - "${PORT:-3000}:3000"
    entrypoint:
      - infisical
      - run
      - --token
      - "${INFISICAL_TOKEN}"
      - --path=/api-gateway
      - --
      - pnpm
      - dev:gateway

  auth-service:
    <<: *backend-service
    container_name: gymcore-auth-service-dev
    entrypoint:
      - infisical
      - run
      - --token
      - "${INFISICAL_TOKEN}"
      - --path=/auth-service
      - --
      - pnpm
      - dev:auth

  gym-management-service:
    <<: *backend-service
    container_name: gymcore-gym-management-service-dev
    entrypoint:
      - infisical
      - run
      - --token
      - "${INFISICAL_TOKEN}"
      - --path=/gym-management-service
      - --
      - pnpm
      - dev:gyms

  payment-service:
    <<: *backend-service
    container_name: gymcore-payment-service-dev
    entrypoint:
      - infisical
      - run
      - --token
      - "${INFISICAL_TOKEN}"
      - --path=/payment-service
      - --
      - pnpm
      - dev:payments

  inventory-service:
    <<: *backend-service
    container_name: gymcore-inventory-service-dev
    entrypoint:
      - infisical
      - run
      - --token
      - "${INFISICAL_TOKEN}"
      - --path=/inventory-service
      - --
      - pnpm
      - dev:inventory

  analytics-service:
    <<: *backend-service
    container_name: gymcore-analytics-service-dev
    entrypoint:
      - infisical
      - run
      - --token
      - "${INFISICAL_TOKEN}"
      - --path=/analytics-service
      - --
      - pnpm
      - dev:analytics

  biometric-service:
    <<: *backend-service
    container_name: gymcore-biometric-service-dev
    entrypoint:
      - infisical
      - run
      - --token
      - "${INFISICAL_TOKEN}"
      - --path=/biometric-service
      - --
      - pnpm
      - dev:biometric

  notification-service:
    <<: *backend-service
    container_name: gymcore-notification-service-dev
    entrypoint:
      - infisical
      - run
      - --token
      - "${INFISICAL_TOKEN}"
      - --path=/notification-service
      - --
      - pnpm
      - dev:notifications
